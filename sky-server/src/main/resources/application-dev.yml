sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sky_takeout
    username: dev
    password: dev123
  # 定义文件上传到 ！阿里云OSS ！的相关配置
  aliyun:
