      bucket-name: sky-takeout-backend
      endpoint: oss-us-west-1.aliyuncs.com
      #关于OSS支持的Region与Endpoint的对应关系，
      # 请参见https://www.alibabacloud.com/help/zh/oss/user-guide/regions-and-endpoints。
      region: us-west-1
      dir: sky-takeout/  # 文件存储目录