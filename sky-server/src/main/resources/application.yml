server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${sky.datasource.driver-class-name}
    url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${sky.datasource.username}
    password: ${sky.datasource.password}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: "a8f3b2c4d5e6f7g8h9i0j1k2l3m4n5o6"
    # 设置jwt过期时间
    admin-ttl: 2592000000 # 30天,单位毫秒
    # 设置前端传递过来的令牌名称
    # 这里设置为了token, 后端期望请求头是：token: <JWT字符串>
    # 而不是标准的：Authorization: Bearer <JWT字符串>
    admin-token-name: token

  # 定义文件上传到 ！阿里云OSS ！的相关配置
  aliyun:
    oss:
      bucket-name: ${aliyun.oss.bucket-name}
      endpoint: ${aliyun.oss.endpoint}
      #关于OSS支持的Region与Endpoint的对应关系，
      # 请参见https://www.alibabacloud.com/help/zh/oss/user-guide/regions-and-endpoints。
      region: ${aliyun.oss.region}
      dir: ${aliyun.oss.dir}}  # 文件存储目录
